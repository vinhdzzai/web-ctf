services:
  galaxy-ctf:
    build: .
    environment:
      PORT: "8000"
      DATABASE_PATH: /app/store/galaxy.sqlite
      SESSION_SECRET: local-galaxy-ctf-session
      ADMIN_PASSWORD: password123
    volumes:
      - galaxy-store:/app/store
      # Copy flag.example.txt to flag.txt locally; flag.txt is intentionally gitignored.
      - type: bind
        source: ./flag.txt
        target: /flag.txt
        read_only: true
        bind:
          create_host_path: false
    networks:
      - challenge
    init: true
  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - galaxy-ctf
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - challenge
      - edge

networks:
  challenge:
    internal: true
  edge:
    driver: bridge

volumes:
  galaxy-store:
