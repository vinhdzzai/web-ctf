<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travelly - Đăng nhập</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="page-shell">
      <section class="hero-panel">
        <div class="hero-overlay">
          <p class="eyebrow">Travelly</p>
          <h1>Khám phá thế giới, bắt đầu từ một cú nhấp</h1>
          <p>
            Đăng nhập để lưu hành trình, theo dõi chuyến đi và nhận ưu đãi du
            lịch hấp dẫn.
          </p>
        </div>
      </section>

      <section class="form-panel">
        <div class="login-panel">
          <h2>Đăng nhập</h2>
          <p class="subtitle">Chào mừng bạn trở lại</p>

          <form id="loginForm" class="auth-form">
            <input type="text" id="username" placeholder="Tên đăng nhập" />
            <input type="password" id="password" placeholder="Mật khẩu" />
            <button type="submit">Đăng nhập</button>
          </form>

          <p class="switch-link">
            Chưa có tài khoản?
            <a href="/register.html">Đăng ký ngay</a>
          </p>

          <h3 id="result">Chưa đăng nhập</h3>
        </div>
      </section>
    </div>
    <!-- Can u login as admin? -->

    <script src="login.js"></script>
  </body>
</html>
